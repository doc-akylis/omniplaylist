[project]
name = "omniplaylist"
version = "0.1.0"
description = "Gerenciador unificado de playlists, estúdio de gêneros e sincronizador de músicas"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OmniPlaylist Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "nicegui>=1.4.15",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rapidfuzz>=3.6.0",
    "spotipy>=2.23.0",
    "ytmusicapi>=1.5.0",
    "yt-dlp>=2024.3.10",
    "mutagen>=1.47.0",
    "playwright>=1.42.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "librosa>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
